name: Generate Nifty200 Symbols (token mapping)

# Aa workflow ne "Actions" tab mathi manually run karvani chhe (Run workflow button).
# Roj-roj chalvani jarur nathi - fakt jyare stock_sector_map.json update thay
# tyare ek vaar chalavo.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Requests install karo
        run: pip install requests

      - name: nifty200_symbols.json generate karo
        run: python generate_nifty200_symbols.py

      - name: nifty200_symbols.json commit karo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nifty200_symbols.json
          git diff --cached --quiet && echo "Kai change nathi thayo" || git commit -m "Auto-generate nifty200_symbols.json"
          git push
